AWSTemplateFormatVersion: '2010-09-09'
Description: Legal Document Batch Processing Pipeline — S3 drop zone with Step Functions orchestration

Parameters:
  EnvironmentName:
    Type: String
    Default: LegalDocSetup
    Description: Environment name (must match the agent stack)
  AgentId:
    Type: String
    Description: Bedrock Collaborator Agent ID from the agent stack
  AgentAliasId:
    Type: String
    Description: Bedrock Collaborator Agent Alias ID from the agent stack
  ClassificationAgentId:
    Type: String
    Description: Classification Agent ID from the agent stack
  ClassificationAliasId:
    Type: String
    Description: Classification Agent Alias ID from the agent stack
  ContractAgentId:
    Type: String
    Description: Contract Agent ID from the agent stack
  ContractAliasId:
    Type: String
    Description: Contract Agent Alias ID from the agent stack
  EmailAgentId:
    Type: String
    Description: Email Agent ID from the agent stack
  EmailAliasId:
    Type: String
    Description: Email Agent Alias ID from the agent stack
  LegalAgentId:
    Type: String
    Description: Legal Agent ID from the agent stack
  LegalAliasId:
    Type: String
    Description: Legal Agent Alias ID from the agent stack
  MaxConcurrency:
    Type: Number
    Default: 5
    Description: Maximum documents processed in parallel

Resources:
  # ============================================================
  # S3 BUCKETS — Input (drop zone) and Output (results)
  # ============================================================
  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${EnvironmentName}-doc-input-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: MoveToProcessedAfter30Days
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 30

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${EnvironmentName}-doc-output-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================================
  # DYNAMODB — Results tracking and metadata
  # ============================================================
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${EnvironmentName}-doc-results"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_id
          AttributeType: S
        - AttributeName: upload_timestamp
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: document_id
          KeyType: HASH
        - AttributeName: upload_timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: upload_timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ============================================================
  # IAM ROLES
  # ============================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BatchPipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt InputBucket.Arn
                  - !Sub "${InputBucket.Arn}/*"
                  - !GetAtt OutputBucket.Arn
                  - !Sub "${OutputBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ResultsTable.Arn
                  - !Sub "${ResultsTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                Resource: "*"

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ExtractTextFunction.Arn
                  - !GetAtt AnalyzeDocumentFunction.Arn
                  - !GetAtt StoreResultsFunction.Arn

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStepFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !GetAtt DocumentProcessingStateMachine.Arn

  # ============================================================
  # LAMBDA FUNCTIONS
  # ============================================================
  ExtractTextFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-extract-text"
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 512
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:pypdf2-layer:2"
      Environment:
        Variables:
          INPUT_BUCKET: !Ref InputBucket
          RESULTS_TABLE: !Ref ResultsTable
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          import io
          import uuid
          import zipfile
          import re
          from datetime import datetime

          import PyPDF2

          s3 = boto3.client('s3')
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['RESULTS_TABLE'])


          def extract_pdf_text(file_bytes):
              """Extract text from PDF using PyPDF2."""
              reader = PyPDF2.PdfReader(io.BytesIO(file_bytes))
              text_parts = []
              for page in reader.pages:
                  page_text = page.extract_text()
                  if page_text:
                      text_parts.append(page_text)
              return '\n'.join(text_parts).strip()


          def extract_docx_text(file_bytes):
              """Extract text from DOCX by reading the XML inside the zip archive."""
              text_parts = []
              with zipfile.ZipFile(io.BytesIO(file_bytes)) as zf:
                  if 'word/document.xml' in zf.namelist():
                      xml_content = zf.read('word/document.xml').decode('utf-8')
                      text_parts = re.findall(r'<w:t[^>]*>(.*?)</w:t>', xml_content)
              return ' '.join(text_parts).strip()


          def handler(event, context):
              bucket = event['detail']['bucket']['name']
              key = event['detail']['object']['key']
              
              # Skip non-document files
              ext = key.rsplit('.', 1)[-1].lower() if '.' in key else ''
              if ext not in ['pdf', 'docx', 'doc', 'txt']:
                  return {'status': 'skipped', 'reason': f'Unsupported file type: {ext}'}
              
              document_id = str(uuid.uuid4())
              timestamp = datetime.utcnow().isoformat()
              
              # Record in DynamoDB as processing
              table.put_item(Item={
                  'document_id': document_id,
                  'upload_timestamp': timestamp,
                  'status': 'PROCESSING',
                  'filename': key.split('/')[-1],
                  's3_key': key,
                  's3_bucket': bucket,
                  'file_type': ext,
              })
              
              # Download file from S3
              obj = s3.get_object(Bucket=bucket, Key=key)
              file_bytes = obj['Body'].read()
              
              # Extract text based on file type
              if ext == 'pdf':
                  text = extract_pdf_text(file_bytes)
              elif ext in ['docx', 'doc']:
                  text = extract_docx_text(file_bytes)
              elif ext == 'txt':
                  text = file_bytes.decode('utf-8')
              else:
                  text = ''
              
              if not text.strip():
                  return {
                      'status': 'skipped',
                      'reason': f'No text could be extracted from {key}'
                  }
              
              return {
                  'document_id': document_id,
                  'timestamp': timestamp,
                  'filename': key.split('/')[-1],
                  's3_bucket': bucket,
                  's3_key': key,
                  'text': text[:25000],
                  'text_length': len(text),
                  'file_type': ext,
              }

  AnalyzeDocumentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-analyze-document"
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 600
      MemorySize: 256
      Environment:
        Variables:
          AGENT_ID: !Ref AgentId
          AGENT_ALIAS_ID: !Ref AgentAliasId
          RESULTS_TABLE: !Ref ResultsTable
          CLASSIFICATION_AGENT_ID: !Ref ClassificationAgentId
          CLASSIFICATION_ALIAS_ID: !Ref ClassificationAliasId
          CONTRACT_AGENT_ID: !Ref ContractAgentId
          CONTRACT_ALIAS_ID: !Ref ContractAliasId
          EMAIL_AGENT_ID: !Ref EmailAgentId
          EMAIL_ALIAS_ID: !Ref EmailAliasId
          LEGAL_AGENT_ID: !Ref LegalAgentId
          LEGAL_ALIAS_ID: !Ref LegalAliasId
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          import uuid
          import time

          bedrock_agent = boto3.client('bedrock-agent-runtime')
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['RESULTS_TABLE'])

          # Agent configuration - direct calls bypass supervisor timeout issues
          AGENTS = {
              'classification': {
                  'id': os.environ.get('CLASSIFICATION_AGENT_ID', ''),
                  'alias': os.environ.get('CLASSIFICATION_ALIAS_ID', ''),
              },
              'Contract': {
                  'id': os.environ.get('CONTRACT_AGENT_ID', ''),
                  'alias': os.environ.get('CONTRACT_ALIAS_ID', ''),
              },
              'Email': {
                  'id': os.environ.get('EMAIL_AGENT_ID', ''),
                  'alias': os.environ.get('EMAIL_ALIAS_ID', ''),
              },
              'Legal': {
                  'id': os.environ.get('LEGAL_AGENT_ID', ''),
                  'alias': os.environ.get('LEGAL_ALIAS_ID', ''),
              },
          }

          def invoke_agent(agent_key, text, max_retries=3):
              """Invoke a single agent with retry logic."""
              agent = AGENTS[agent_key]
              for attempt in range(max_retries):
                  try:
                      response = bedrock_agent.invoke_agent(
                          agentId=agent['id'],
                          agentAliasId=agent['alias'],
                          sessionId=str(uuid.uuid4()),
                          inputText=text
                      )
                      full_response = ""
                      if 'completion' in response:
                          for event_chunk in response['completion']:
                              if isinstance(event_chunk, dict) and 'chunk' in event_chunk:
                                  if 'bytes' in event_chunk['chunk']:
                                      full_response += event_chunk['chunk']['bytes'].decode('utf-8')
                      return full_response if full_response else None
                  except Exception as e:
                      error_str = str(e).lower()
                      is_retryable = ('throttling' in error_str or 'timeout' in error_str or 'dependencyfailed' in error_str)
                      if is_retryable and attempt < max_retries - 1:
                          time.sleep((2 ** attempt) * 10)
                          continue
                      raise
              return None

          def handler(event, context):
              document_id = event['document_id']
              text = event['text']
              filename = event['filename']
              
              # Update status
              table.update_item(
                  Key={'document_id': document_id, 'upload_timestamp': event['timestamp']},
                  UpdateExpression='SET #s = :s',
                  ExpressionAttributeNames={'#s': 'status'},
                  ExpressionAttributeValues={':s': 'ANALYZING'}
              )
              
              try:
                  # Step 1: Classification (use first 5000 chars)
                  classification_result = invoke_agent('classification', text[:5000])
                  
                  # Step 2: Determine document type and route to specialist
                  doc_type = 'Contract'  # default
                  if classification_result:
                      try:
                          # Handle double-braces from agent output
                          clean = classification_result.replace('{{', '{').replace('}}', '}')
                          parsed = json.loads(clean)
                          if isinstance(parsed, dict) and 'classification' in parsed:
                              doc_type = parsed['classification'].get('category', 'Contract')
                      except (json.JSONDecodeError, ValueError):
                          pass
                  
                  # Step 3: Specialist analysis (use first 5000 chars)
                  specialist_result = invoke_agent(doc_type, text[:5000])
                  
                  # Combine results
                  analysis = json.dumps({
                      'classification': classification_result,
                      'specialist_analysis': specialist_result,
                      'document_type': doc_type,
                      'filename': filename,
                      'text_length': event['text_length'],
                  }, indent=2)
                  
                  return {
                      'document_id': document_id,
                      'timestamp': event['timestamp'],
                      'filename': filename,
                      'analysis': analysis,
                      'status': 'COMPLETED',
                      'text_length': event['text_length'],
                  }
                  
              except Exception as e:
                  return {
                      'document_id': document_id,
                      'timestamp': event['timestamp'],
                      'filename': filename,
                      'analysis': None,
                      'status': 'FAILED',
                      'error': str(e),
                      'text_length': event.get('text_length', 0),
                  }

  StoreResultsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-store-results"
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          OUTPUT_BUCKET: !Ref OutputBucket
          RESULTS_TABLE: !Ref ResultsTable
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          from datetime import datetime

          s3 = boto3.client('s3')
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['RESULTS_TABLE'])
          output_bucket = os.environ['OUTPUT_BUCKET']

          def handler(event, context):
              document_id = event['document_id']
              timestamp = event['timestamp']
              filename = event['filename']
              status = event['status']
              analysis = event.get('analysis', '')
              error = event.get('error', '')
              
              # Store analysis result in S3
              if analysis:
                  result_key = f"results/{datetime.utcnow().strftime('%Y/%m/%d')}/{document_id}/{filename}.json"
                  s3.put_object(
                      Bucket=output_bucket,
                      Key=result_key,
                      Body=json.dumps({
                          'document_id': document_id,
                          'filename': filename,
                          'analysis': analysis,
                          'processed_at': datetime.utcnow().isoformat(),
                          'text_length': event.get('text_length', 0),
                      }, indent=2),
                      ContentType='application/json'
                  )
              else:
                  result_key = None
              
              # Update DynamoDB
              table.update_item(
                  Key={'document_id': document_id, 'upload_timestamp': timestamp},
                  UpdateExpression='SET #s = :s, completed_at = :c, result_key = :r, error_message = :e',
                  ExpressionAttributeNames={'#s': 'status'},
                  ExpressionAttributeValues={
                      ':s': status,
                      ':c': datetime.utcnow().isoformat(),
                      ':r': result_key,
                      ':e': error,
                  }
              )
              
              return {
                  'document_id': document_id,
                  'status': status,
                  'result_key': result_key,
              }

  # ============================================================
  # STEP FUNCTIONS — Document processing workflow
  # ============================================================
  DocumentProcessingStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${EnvironmentName}-doc-processing"
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Legal Document Batch Processing Pipeline",
          "StartAt": "ExtractText",
          "States": {
            "ExtractText": {
              "Type": "Task",
              "Resource": "${ExtractTextFunction.Arn}",
              "ResultPath": "$",
              "Next": "CheckSkipped",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 5,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "MarkFailed"
                }
              ]
            },
            "CheckSkipped": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.status",
                  "IsPresent": true,
                  "Next": "SkippedEnd"
                }
              ],
              "Default": "AnalyzeDocument"
            },
            "AnalyzeDocument": {
              "Type": "Task",
              "Resource": "${AnalyzeDocumentFunction.Arn}",
              "ResultPath": "$",
              "Next": "StoreResults",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "MarkFailed"
                }
              ]
            },
            "StoreResults": {
              "Type": "Task",
              "Resource": "${StoreResultsFunction.Arn}",
              "ResultPath": "$",
              "End": true,
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "MarkFailed"
                }
              ]
            },
            "MarkFailed": {
              "Type": "Pass",
              "Result": "FAILED",
              "ResultPath": "$.final_status",
              "End": true
            },
            "SkippedEnd": {
              "Type": "Succeed"
            }
          }
        }

  # ============================================================
  # EVENTBRIDGE — Trigger pipeline on S3 upload
  # ============================================================
  S3UploadRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-doc-upload-trigger"
      Description: "Trigger document processing when files are uploaded to input bucket"
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name:
              - !Ref InputBucket
          object:
            key:
              - prefix: "upload/"
      Targets:
        - Id: StartProcessing
          Arn: !GetAtt DocumentProcessingStateMachine.Arn
          RoleArn: !GetAtt EventBridgeRole.Arn

Outputs:
  InputBucketName:
    Description: S3 bucket to drop documents for processing
    Value: !Ref InputBucket
    Export:
      Name: !Sub "${EnvironmentName}-InputBucket"

  OutputBucketName:
    Description: S3 bucket where analysis results are stored
    Value: !Ref OutputBucket
    Export:
      Name: !Sub "${EnvironmentName}-OutputBucket"

  ResultsTableName:
    Description: DynamoDB table tracking all processing results
    Value: !Ref ResultsTable
    Export:
      Name: !Sub "${EnvironmentName}-ResultsTable"

  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !GetAtt DocumentProcessingStateMachine.Arn
    Export:
      Name: !Sub "${EnvironmentName}-StateMachineArn"

  UploadPath:
    Description: Drop files here to trigger processing
    Value: !Sub "s3://${InputBucket}/upload/"
