version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - echo "No frontend build needed - Streamlit runs as container"
        build:
          commands:
            - echo "Build handled by Docker"
      artifacts:
        baseDirectory: /
        files:
          - '**/*'
    backend:
      phases:
        build:
          commands:
            - docker build -t legal-doc-analyzer .
